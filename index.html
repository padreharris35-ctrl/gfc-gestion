<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComptaGFC | ECF Supabase PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f1f5f9; }
        .excel-table { width: 100%; border-collapse: collapse; background: white; }
        .excel-table th { background: #003366; color: white; padding: 12px; font-size: 11px; text-transform: uppercase; text-align: left; position: sticky; top: 0; z-index: 10; }
        .excel-table td { border: 1px solid #e2e8f0; padding: 10px 14px; font-size: 13px; color: #334155; }
        .excel-table tr:hover { background-color: #f8fafc; }
        .status-badge { font-size: 10px; padding: 4px 10px; border-radius: 12px; font-weight: bold; display: flex; align-items: center; gap: 4px; }
        .sync-active { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="bg-[#003366] text-white p-4 flex justify-between items-center shadow-lg border-b-4 border-emerald-500">
        <div class="flex items-center gap-4">
            <div class="bg-white p-2 rounded-lg"><i class="fas fa-chart-line text-[#003366] text-xl"></i></div>
            <div>
                <h1 class="text-xl font-bold italic text-white">Compta<span class="text-emerald-400">GFC</span></h1>
                <p class="text-[10px] uppercase tracking-widest text-blue-200">Entreprise Cissé et Frères</p>
            </div>
        </div>
        <div class="text-right">
            <div id="statSolde" class="text-2xl font-mono font-bold text-emerald-400">0 FCFA</div>
            <div class="text-[10px] text-blue-200 uppercase">Solde Réel en Caisse</div>
        </div>
    </header>

    <nav class="bg-white border-b p-3 flex justify-between items-center px-6">
        <div class="flex gap-3">
            <button onclick="openModal()" class="bg-[#003366] text-white px-5 py-2.5 rounded text-xs font-bold uppercase hover:bg-slate-800 transition-all">
                <i class="fas fa-plus-circle mr-1"></i> Nouveau Mouvement
            </button>
            <button onclick="exportPDF()" class="bg-red-600 text-white px-5 py-2.5 rounded text-xs font-bold uppercase hover:bg-red-700 transition-all">
                <i class="fas fa-file-pdf mr-1"></i> Générer Journal
            </button>
            <div class="status-badge sync-active"><i class="fas fa-check-circle"></i> Supabase Connecté</div>
        </div>
        <div class="flex items-center gap-2 bg-slate-50 p-1 rounded border">
            <select id="filterMonth" onchange="render()" class="bg-transparent p-1 text-xs font-bold outline-none border-r">
                <option value="ALL">Tous les mois</option>
                <option value="0">Janvier</option><option value="1">Février</option><option value="2">Mars</option>
                <option value="3">Avril</option><option value="4">Mai</option><option value="5">Juin</option>
                <option value="6">Juillet</option><option value="7">Août</option><option value="8">Septembre</option>
                <option value="9">Octobre</option><option value="10">Novembre</option><option value="11">Décembre</option>
            </select>
            <select id="filterYear" onchange="render()" class="bg-transparent p-1 text-xs font-bold outline-none"></select>
        </div>
    </nav>

    <main class="flex-1 overflow-auto p-6 bg-slate-100">
        <div class="bg-white shadow-xl rounded-xl overflow-hidden border border-slate-200">
            <table class="excel-table">
                <thead>
                    <tr>
                        <th class="w-12 text-center">N°</th>
                        <th class="w-28">Date</th>
                        <th>Désignation</th>
                        <th>Tiers</th>
                        <th class="w-32">Mode</th>
                        <th class="text-right w-44">Montant (FCFA)</th>
                        <th class="w-16 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="excelBody"></tbody>
            </table>
            <div id="emptyState" class="hidden p-20 text-center text-slate-400">
                <i class="fas fa-folder-open text-5xl mb-4 opacity-20"></i>
                <p>Aucune donnée pour cette période.</p>
            </div>
        </div>
    </main>

    <div id="modalEntry" class="fixed inset-0 bg-slate-900/80 z-[100] hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white w-full max-w-lg shadow-2xl rounded-2xl overflow-hidden">
            <div class="bg-[#003366] text-white p-5 flex justify-between">
                <h3 class="font-bold uppercase text-sm">Saisie Comptable</h3>
                <button onclick="closeModal()" class="text-white/50 hover:text-white text-xl">&times;</button>
            </div>
            <div class="p-8 grid grid-cols-2 gap-5">
                <div class="col-span-2">
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Désignation</label>
                    <input type="text" id="f_lib" class="w-full border-b-2 border-slate-200 p-2 text-sm outline-none focus:border-blue-500">
                </div>
                <div class="col-span-2">
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Tiers (Client/Fournisseur)</label>
                    <input type="text" id="f_prov" class="w-full border-b-2 border-slate-200 p-2 text-sm outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Type</label>
                    <select id="f_type" class="w-full border-b-2 border-slate-200 p-2 text-sm font-bold text-blue-900 outline-none">
                        <option value="ENTREE">RECETTE (+)</option>
                        <option value="SORTIE">DÉPENSE (-)</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Montant (FCFA)</label>
                    <input type="number" id="f_mt" class="w-full border-b-2 border-slate-200 p-2 text-sm font-bold text-emerald-600 outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Mode</label>
                    <select id="f_mode" class="w-full border-b-2 border-slate-200 p-2 text-sm outline-none">
                        <option>Espèce</option>
                        <option>Virement</option>
                        <option>Mobile Money</option>
                        <option>Chèque</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Date</label>
                    <input type="date" id="f_date" required class="w-full border-b-2 border-slate-200 p-2 text-sm outline-none">
                </div>
                <button onclick="saveToSupabase()" class="col-span-2 bg-emerald-600 text-white p-4 font-bold uppercase text-xs mt-4 rounded-xl shadow-lg hover:bg-emerald-700">
                    Enregistrer l'opération
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION (Remplissez vos clés ici entre les guillemets) ---
        const SUPABASE_URL = 'https://hovabdbreaqvtamfacaj.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_d1QmjaWGesiNT-V1WlddoQ_gk9C0r22';

        // Initialisation sécurisée
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let transactions = [];

        // --- 2. FONCTIONS DE BASE (Priorité pour l'interface) ---
        function openModal() { document.getElementById('modalEntry').classList.remove('hidden'); }
        function closeModal() { document.getElementById('modalEntry').classList.add('hidden'); }

        function setupYears() {
            const s = document.getElementById('filterYear');
            if(!s) return;
            const curY = new Date().getFullYear();
            s.innerHTML = ''; 
            for(let y = curY - 10; y <= curY + 25; y++){ 
                let o = document.createElement('option'); 
                o.value = y; o.text = y; 
                if(y == curY) o.selected = true; 
                s.add(o); 
            }
        }

        // --- 3. FONCTIONS SUPABASE ---
        async function fetchSupabase() {
            try {
                const { data, error } = await supabaseClient
                    .from('transactions')
                    .select('*')
                    .order('date', { ascending: false });

                if (error) throw error;
                transactions = data;
                render();
            } catch (e) {
                console.error("Erreur connexion Supabase:", e.message);
                alert("Erreur de connexion. Vérifiez vos clés API.");
            }
        }

        async function saveToSupabase() {
            const lib = document.getElementById('f_lib').value;
            const mt = parseFloat(document.getElementById('f_mt').value);
            const dt = document.getElementById('f_date').value;

            if(!lib || isNaN(mt) || !dt) return alert("Remplissez Libellé, Montant et Date !");

            const newTx = {
                date: dt, libelle: lib, provenance: document.getElementById('f_prov').value || "-",
                type: document.getElementById('f_type').value, mode: document.getElementById('f_mode').value, montant: mt
            };

            const { error } = await supabaseClient.from('transactions').insert([newTx]);
            if (error) alert("Erreur SQL: " + error.message);
            else { closeModal(); fetchSupabase(); }
        }

        async function deleteTx(id) {
            if(confirm("Confirmer la suppression ?")) {
                const { error } = await supabaseClient.from('transactions').delete().eq('id', id);
                if (!error) fetchSupabase();
            }
        }

        // --- 4. AFFICHAGE ---
        function render() {
            const m = document.getElementById('filterMonth').value;
            const y = document.getElementById('filterYear').value;
            const body = document.getElementById('excelBody');
            const emptyState = document.getElementById('emptyState');
            
            body.innerHTML = '';
            let total = 0;

            const filtered = transactions.filter(t => {
                const d = new Date(t.date);
                return (m === 'ALL' || d.getMonth() == m) && d.getFullYear() == y;
            });

            if(filtered.length === 0) emptyState.classList.remove('hidden');
            else {
                emptyState.classList.add('hidden');
                filtered.forEach((t, i) => {
                    const isE = t.type === 'ENTREE';
                    total += isE ? t.montant : -t.montant;
                    body.innerHTML += `
                        <tr>
                            <td class="text-center opacity-30 text-[10px]">${i+1}</td>
                            <td>${t.date}</td>
                            <td class="font-bold uppercase">${t.libelle}</td>
                            <td class="uppercase text-xs text-slate-500">${t.provenance}</td>
                            <td class="text-[10px] italic">${t.mode}</td>
                            <td class="text-right font-bold ${isE?'text-emerald-600':'text-red-600'}">
                                ${isE?'+':'-'} ${t.montant.toLocaleString('fr-FR')}
                            </td>
                            <td class="text-center">
                                <button onclick="deleteTx(${t.id})"><i class="fas fa-trash text-slate-200 hover:text-red-400"></i></button>
                            </td>
                        </tr>`;
                });
            }
            document.getElementById('statSolde').innerText = total.toLocaleString('fr-FR') + " FCFA";
        }

        function exportPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    
    // Récupération des filtres pour le titre
    const m = document.getElementById('filterMonth').value;
    const y = document.getElementById('filterYear').value;
    const moisSelectionne = document.getElementById('filterMonth').options[document.getElementById('filterMonth').selectedIndex].text.toUpperCase();
    const periodeLabel = m === 'ALL' ? `ANNÉE ${y}` : `${moisSelectionne} ${y}`;

    // --- EN-TÊTE DU PDF ---
    doc.setFont("helvetica", "bold");
    doc.setFontSize(16);
    doc.setTextColor(0, 51, 102); // Bleu foncé ECF
    doc.text("COMPTABILITE GBELEBAN FOOTBALL CLUB", 105, 15, { align: "center" });
    
    doc.setFontSize(11);
    doc.setTextColor(100, 100, 100); // Gris pour le sous-titre
    doc.text(`JOURNAL DE TRESORERIE : ${periodeLabel}`, 105, 22, { align: "center" });
    
    // Petite ligne de séparation
    doc.setDrawColor(0, 51, 102);
    doc.setLineWidth(0.5);
    doc.line(40, 25, 170, 25);

    // --- PRÉPARATION DES DONNÉES ---
    let totalPeriode = 0;
    const dataFiltrée = transactions.filter(t => {
        const d = new Date(t.date);
        return (m === 'ALL' || d.getMonth() == m) && d.getFullYear() == y;
    }).sort((a, b) => new Date(a.date) - new Date(b.date)); // Tri par date chronologique

    const corpsTableau = dataFiltrée.map(t => {
        const isE = t.type === 'ENTREE';
        totalPeriode += isE ? t.montant : -t.montant;
        return [
            t.date, 
            t.libelle.toUpperCase(), 
            t.provenance.toUpperCase(), 
            t.mode.toUpperCase(), 
            (isE ? '+' : '-') + " " + t.montant.toLocaleString('fr-FR')
        ];
    });

    // --- GÉNÉRATION DU TABLEAU ---
    doc.autoTable({
        startY: 32,
        head: [['DATE', 'DESIGNATION', 'TIERS / CLIENT', 'MODE', 'MONTANT (FCFA)']],
        body: corpsTableau,
        theme: 'grid',
        headStyles: { fillColor: [0, 51, 102], halign: 'center', fontSize: 9 },
        columnStyles: {
            4: { halign: 'right', fontStyle: 'bold' } // Montant à droite
        },
        foot: [[
            { content: 'SOLDE NET DE LA PÉRIODE', colSpan: 4, styles: { halign: 'right', fontStyle: 'bold', fillColor: [240, 240, 240] } },
            { content: totalPeriode.toLocaleString('fr-FR') + " FCFA", styles: { halign: 'right', fontStyle: 'bold', fillColor: [240, 240, 240] } }
        ]],
        styles: { fontSize: 8 }
    });

    // Sauvegarde avec nom de fichier clair
    doc.save(`Journal_GFC_${periodeLabel.replace(' ', '_')}.pdf`);
}
        // --- 5. INITIALISATION ---
        window.onload = () => {
            setupYears();
            document.getElementById('f_date').valueAsDate = new Date();
            fetchSupabase();
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0b1f45">
  <title>Connexion · Gbéléban Football Club</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-connexion">
  <main class="connexion">
    <div class="connexion-blason">
      <img src="assets/logo.png" alt="Blason du Gbéléban Football Club" width="640" height="640">
      <svg class="anneau" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="anneau-trace" cx="50" cy="50" r="49.5" transform="rotate(-90 50 50)"/>
        <g class="anneau-rouge"><circle cx="50" cy="50" r="49.5"/></g>
        <g class="anneau-or"><circle cx="50" cy="50" r="49.5"/></g>
      </svg>
    </div>

    <section class="connexion-carte" aria-labelledby="titre-connexion">
      <p class="connexion-club">Gbéléban Football Club</p>
      <h1 id="titre-connexion">Espace de gestion du club</h1>
      <p class="connexion-intro">Réservé aux dirigeants, entraîneurs et membres du staff.</p>

      <form id="form-connexion" class="formulaire" novalidate>
        <div class="champ">
          <label for="email">Adresse email</label>
          <input id="email" name="email" type="email" autocomplete="username" inputmode="email" required>
        </div>
        <div class="champ">
          <label for="password">Mot de passe</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p id="erreur-connexion" class="message-erreur" role="alert" hidden></p>
        <button type="submit" class="bouton bouton-principal bouton-large">Se connecter</button>
      </form>

      <p class="connexion-aide">Mot de passe oublié ? Demandez à un administrateur du club de vous en attribuer un nouveau.</p>
    </section>

    <p class="connexion-pied">Données personnelles protégées · accès sur invitation</p>
  </main>

  <script type="module">
    import { initialiserPageConnexion } from './js/auth.js';
    initialiserPageConnexion();
  </script>
</body>
</html>

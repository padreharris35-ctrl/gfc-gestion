<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComptaGFC | Gbelebaban Football Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f1f5f9; }
        .excel-table { width: 100%; border-collapse: collapse; background: white; }
        .excel-table th { background: #003366; color: white; padding: 12px; font-size: 11px; text-transform: uppercase; text-align: left; }
        .excel-table td { border: 1px solid #e2e8f0; padding: 10px; font-size: 13px; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="bg-[#003366] text-white p-4 shadow-lg border-b-4 border-emerald-500">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-4">
            <div class="bg-white p-2 rounded-lg"><i class="fas fa-volleyball-ball text-[#003366] text-xl"></i></div>
            <div>
                <h1 class="text-xl font-bold italic">Compta<span class="text-emerald-400">GFC</span></h1>
                <p class="text-[10px] uppercase tracking-widest text-blue-200 font-bold">Gbelebaban Football Club</p>
            </div>
        </div>

        <div class="flex flex-wrap justify-center gap-6 bg-slate-900/40 p-3 rounded-xl border border-white/10">
            <div class="text-center px-4 border-r border-white/10">
                <div id="statEntrees" class="text-lg font-mono font-bold text-emerald-400">0 FCFA</div>
                <div class="text-[9px] uppercase text-emerald-200 opacity-70">Total Entrées</div>
            </div>
            <div class="text-center px-4 border-r border-white/10">
                <div id="statSorties" class="text-lg font-mono font-bold text-red-400">0 FCFA</div>
                <div class="text-[9px] uppercase text-red-200 opacity-70">Total Dépenses</div>
            </div>
            <div class="text-center px-4">
                <div id="statSolde" class="text-xl font-mono font-bold text-white">0 FCFA</div>
                <div class="text-[9px] uppercase text-blue-200 opacity-70 font-bold">Solde Global</div>
            </div>
        </div>
    </div>
</header>

    <nav class="bg-white border-b p-3 flex justify-between items-center px-6">
        <div class="flex gap-3">
            <button onclick="openModal()" class="bg-[#003366] text-white px-5 py-2.5 rounded text-xs font-bold uppercase hover:bg-slate-800 transition-all">
                <i class="fas fa-plus-circle mr-2"></i> Nouveau Mouvement
            </button>
            <button onclick="exportPDF()" class="bg-red-600 text-white px-5 py-2.5 rounded text-xs font-bold uppercase hover:bg-red-700 transition-all">
                <i class="fas fa-file-pdf mr-2"></i> Générer Journal
            </button>
        </div>
        <div class="flex items-center gap-2 bg-slate-100 p-1.5 rounded border">
            <select id="filterMonth" onchange="render()" class="bg-transparent p-1 text-xs font-bold outline-none border-r">
                <option value="ALL">Tous les mois</option>
                <option value="0">Janvier</option><option value="1">Février</option><option value="2">Mars</option>
                <option value="3">Avril</option><option value="4">Mai</option><option value="5">Juin</option>
                <option value="6">Juillet</option><option value="7">Août</option><option value="8">Septembre</option>
                <option value="9">Octobre</option><option value="10">Novembre</option><option value="11">Décembre</option>
            </select>
            <select id="filterYear" onchange="render()" class="bg-transparent p-1 text-xs font-bold outline-none"></select>
        </div>
    </nav>

    <main class="flex-1 overflow-auto p-6 bg-slate-100">
        <div class="bg-white shadow-xl rounded-xl overflow-hidden border border-slate-200">
            <table class="excel-table">
                <thead>
                    <tr>
                        <th class="w-12 text-center">N°</th>
                        <th class="w-28">Date</th>
                        <th>Désignation</th>
                        <th>Tiers</th>
                        <th>Mode</th>
                        <th class="text-right">Montant (FCFA)</th>
                        <th class="w-16 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="excelBody"></tbody>
            </table>
        </div>
    </main>

    <div id="modalEntry" class="fixed inset-0 bg-slate-900/80 z-[100] hidden flex items-center justify-center">
        <div class="bg-white w-full max-w-lg shadow-2xl rounded-2xl overflow-hidden">
            <div class="bg-[#003366] text-white p-5 flex justify-between">
                <h3 class="font-bold uppercase text-sm">Saisie Comptable GFC</h3>
                <button onclick="closeModal()" class="text-white/50 hover:text-white text-xl">&times;</button>
            </div>
            <div class="p-8 grid grid-cols-2 gap-5">
                <div class="col-span-2">
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Désignation</label>
                    <input type="text" id="f_lib" class="w-full border-b-2 border-slate-200 p-2 text-sm outline-none">
                </div>
                <div class="col-span-2">
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Tiers (Client / Destinataire)</label>
                    <input type="text" id="f_prov" class="w-full border-b-2 border-slate-200 p-2 text-sm outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Type</label>
                    <select id="f_type" class="w-full border-b-2 border-slate-200 p-2 text-sm font-bold">
                        <option value="ENTREE">RECETTE (+)</option>
                        <option value="SORTIE">DÉPENSE (-)</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Montant (FCFA)</label>
                    <input type="number" id="f_mt" class="w-full border-b-2 border-slate-200 p-2 text-sm font-bold text-emerald-600">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Mode</label>
                    <select id="f_mode" class="w-full border-b-2 border-slate-200 p-2 text-sm">
                        <option>Espèce</option>
                        <option>Virement</option>
                        <option>Mobile Money</option>
                        <option>Chèque</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Date</label>
                    <input type="date" id="f_date" class="w-full border-b-2 border-slate-200 p-2 text-sm">
                </div>
                <button onclick="saveToSupabase()" class="col-span-2 bg-emerald-600 text-white p-4 font-bold uppercase text-xs mt-4 rounded-xl">
                    Enregistrer
                </button>
            </div>
        </div>
    </div>

    <script>
        // 1. CONFIGURATION
        const SUPABASE_URL = 'https://hovabdbreaqvtamfacaj.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_d1QmjaWGesiNT-V1WlddoQ_gk9C0r22';

        let supabaseClient;
        let transactions = [];

        // 2. FONCTIONS DE BASE (Déclarées tout de suite pour éviter les erreurs "is not defined")
        window.openModal = function() { document.getElementById('modalEntry').classList.remove('hidden'); }
        window.closeModal = function() { document.getElementById('modalEntry').classList.add('hidden'); }

        window.setupYears = function() {
            const s = document.getElementById('filterYear');
            if(!s) return;
            const curY = new Date().getFullYear();
            s.innerHTML = ''; 
            for(let y = curY - 5; y <= curY + 2; y++){ 
                let o = document.createElement('option'); 
                o.value = y; o.text = y; 
                if(y === curY) o.selected = true; 
                s.add(o); 
            }
        }

        async function fetchSupabase() {
            try {
                const { data, error } = await supabaseClient.from('transactions').select('*').order('date', { ascending: false });
                if (!error) { transactions = data; render(); }
            } catch (e) { console.log("Erreur de fetch"); }
        }

        window.saveToSupabase = async function() {
            const lib = document.getElementById('f_lib').value;
            const mt = parseFloat(document.getElementById('f_mt').value);
            const dt = document.getElementById('f_date').value;
            if(!lib || !mt || !dt) return alert("Remplissez tout !");

            if(!confirm("Valider l'enregistrement ?")) return;

            const newTx = {
                date: dt, libelle: lib, provenance: document.getElementById('f_prov').value || "-",
                type: document.getElementById('f_type').value, mode: document.getElementById('f_mode').value, montant: mt
            };

            const { error } = await supabaseClient.from('transactions').insert([newTx]);
            if (error) alert("Erreur SQL");
            else { closeModal(); fetchSupabase(); }
        }

        window.deleteTx = async function(id) {
            if (prompt("CODE SÉCURITÉ :") === "2026") {
                await supabaseClient.from('transactions').delete().eq('id', id);
                fetchSupabase();
            }
        }

       window.render = function() {
    const m = document.getElementById('filterMonth').value;
    const y = document.getElementById('filterYear').value;
    const body = document.getElementById('excelBody');
    body.innerHTML = '';
    
    // Variables pour les trois compteurs
    let totalEntrees = 0;
    let totalSorties = 0;

    transactions.filter(t => {
        const d = new Date(t.date);
        return (m === 'ALL' || d.getMonth() == m) && d.getFullYear() == y;
    }).forEach((t, i) => {
        const isE = t.type === 'ENTREE';
        
        // Calcul des totaux séparés
        if (isE) {
            totalEntrees += t.montant;
        } else {
            totalSorties += t.montant;
        }

        body.innerHTML += `
            <tr class="hover:bg-slate-50 border-b">
                <td class="text-center opacity-50">${i+1}</td>
                <td>${t.date}</td>
                <td class="font-bold uppercase">${t.libelle}</td>
                <td class="text-xs text-slate-500 uppercase">${t.provenance}</td>
                <td class="text-[10px] italic">${t.mode}</td>
                <td class="text-right font-mono font-bold ${isE?'text-emerald-600':'text-red-600'}">
                    ${isE?'+':'-'} ${t.montant.toLocaleString('fr-FR')}
                </td>
                <td class="text-center">
                    <button onclick="deleteTx(${t.id})" class="text-slate-300 hover:text-red-500">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </td>
            </tr>`;
    });

    // Calcul du solde global
    const soldeGlobal = totalEntrees - totalSorties;

    // Affichage des trois compteurs
    document.getElementById('statEntrees').innerText = totalEntrees.toLocaleString('fr-FR') + " FCFA";
    document.getElementById('statSorties').innerText = totalSorties.toLocaleString('fr-FR') + " FCFA";
    
    const soldeEl = document.getElementById('statSolde');
    soldeEl.innerText = soldeGlobal.toLocaleString('fr-FR') + " FCFA";
    
    // Couleur du solde global selon s'il est positif ou négatif
    soldeEl.className = `text-xl font-mono font-bold ${soldeGlobal >= 0 ? 'text-white' : 'text-red-400'}`;
}

        window.exportPDF = function() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const m = document.getElementById('filterMonth').value;
            const y = document.getElementById('filterYear').value;
            
            doc.setFontSize(16);
            doc.text("COMPTABILITE GBELEBAN FOOTBALL CLUB", 105, 15, { align: "center" });
            doc.setFontSize(10);
            doc.text(`JOURNAL DE TRESORERIE - PERIODE : ${m}/${y}`, 105, 22, { align: "center" });

            const data = transactions.filter(t => {
                const d = new Date(t.date);
                return (m === 'ALL' || d.getMonth() == m) && d.getFullYear() == y;
            }).map(t => [t.date, t.libelle, t.provenance, t.mode, t.montant.toLocaleString()]);

            doc.autoTable({
                startY: 30,
                head: [['DATE', 'DESIGNATION', 'TIERS', 'MODE', 'MONTANT']],
                body: data,
                theme: 'grid'
            });
            doc.save("GFC_Journal.pdf");
        }

        // 3. INITIALISATION (ORDRE CRITIQUE)
        window.onload = () => {
            setupYears(); // On affiche d'abord les années !
            document.getElementById('f_date').valueAsDate = new Date();
            
            try {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                fetchSupabase();
            } catch(e) {
                console.log("Supabase non configuré");
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComptaGFC | ECF Supabase PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f1f5f9; }
        .excel-table { width: 100%; border-collapse: collapse; background: white; }
        .excel-table th { background: #003366; color: white; padding: 12px; font-size: 11px; text-transform: uppercase; text-align: left; position: sticky; top: 0; z-index: 10; }
        .excel-table td { border: 1px solid #e2e8f0; padding: 10px 14px; font-size: 13px; color: #334155; }
        .excel-table tr:hover { background-color: #f1f5f9; transition: 0.2s; }
        .status-badge { font-size: 10px; padding: 4px 10px; border-radius: 12px; font-weight: bold; display: flex; items-center; gap: 4px; }
        .sync-active { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="bg-[#003366] text-white p-4 flex justify-between items-center shadow-lg border-b-4 border-emerald-500">
        <div class="flex items-center gap-4">
            <div class="bg-white p-2 rounded-lg">
                <i class="fas fa-chart-line text-[#003366] text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight">Compta<span class="text-emerald-400">GFC</span> <span class="text-xs font-normal opacity-70">v3.0</span></h1>
                <p class="text-[10px] uppercase tracking-widest text-blue-200">Entreprise Cissé et Frères</p>
            </div>
        </div>
        <div class="text-right">
            <div id="statSolde" class="text-2xl font-mono font-bold text-emerald-400">0 FCFA</div>
            <div class="text-[10px] text-blue-200 uppercase">Solde Réel en Caisse</div>
        </div>
    </header>

    <nav class="bg-white border-b p-3 flex flex-wrap justify-between items-center px-6 gap-4">
        <div class="flex gap-3">
            <button onclick="openModal()" class="bg-[#003366] text-white px-5 py-2.5 rounded-md text-xs font-bold uppercase shadow-md hover:bg-slate-800 transition-all flex items-center gap-2">
                <i class="fas fa-plus-circle"></i> Nouveau Mouvement
            </button>
            <button onclick="exportPDF()" class="bg-red-600 text-white px-5 py-2.5 rounded-md text-xs font-bold uppercase shadow-md hover:bg-red-700 transition-all flex items-center gap-2">
                <i class="fas fa-file-pdf"></i> Générer Journal
            </button>
            <div class="status-badge sync-active">
                <i class="fas fa-shield-alt"></i> Données Sécurisées (Supabase)
            </div>
        </div>
        <div class="flex items-center gap-3 bg-slate-50 p-1.5 rounded-lg border">
            <i class="fas fa-filter text-slate-400 ml-2"></i>
            <select id="filterMonth" onchange="render()" class="bg-transparent p-1 text-xs font-bold outline-none border-r pr-4">
                <option value="ALL">Tous les mois</option>
                <option value="0">Janvier</option><option value="1">Février</option><option value="2">Mars</option>
                <option value="3">Avril</option><option value="4">Mai</option><option value="5">Juin</option>
                <option value="6">Juillet</option><option value="7">Août</option><option value="8">Septembre</option>
                <option value="9">Octobre</option><option value="10">Novembre</option><option value="11">Décembre</option>
            </select>
            <select id="filterYear" onchange="render()" class="bg-transparent p-1 text-xs font-bold outline-none"></select>
        </div>
    </nav>

    <main class="flex-1 overflow-auto p-6 bg-slate-100">
        <div class="bg-white shadow-xl rounded-xl overflow-hidden border border-slate-200">
            <table class="excel-table">
                <thead>
                    <tr>
                        <th class="w-12 text-center">N°</th>
                        <th class="w-28">Date Effet</th>
                        <th>Désignation de l'opération</th>
                        <th>Tiers / Client</th>
                        <th class="w-32">Mode Paiement</th>
                        <th class="text-right w-44">Montant (FCFA)</th>
                        <th class="w-16 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="excelBody"></tbody>
            </table>
            <div id="emptyState" class="hidden p-20 text-center text-slate-400">
                <i class="fas fa-folder-open text-5xl mb-4 opacity-20"></i>
                <p>Aucune transaction trouvée pour cette période.</p>
            </div>
        </div>
    </main>

    <div id="modalEntry" class="fixed inset-0 bg-slate-900/80 z-[100] hidden flex items-center justify-center backdrop-blur-sm p-4">
        <div class="bg-white w-full max-w-lg shadow-2xl rounded-2xl overflow-hidden">
            <div class="bg-[#003366] text-white p-5 flex justify-between items-center">
                <h3 class="font-bold uppercase tracking-tight text-sm">Enregistrement Comptable</h3>
                <button onclick="closeModal()" class="text-white/50 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-8 grid grid-cols-2 gap-5">
                <div class="col-span-2">
                    <label class="text-[10px] font-bold text-slate-400 uppercase mb-1 block">Libellé de l'opération</label>
                    <input type="text" id="f_lib" placeholder="Ex: Achat pièces détachées ou Vente Véhicule" class="w-full border-b-2 border-slate-200 p-2 text-sm outline-none focus:border-blue-500 transition-all">
                </div>
                <div class="col-span-2">
                    <label class="text-[10px] font-bold text-slate-400 uppercase mb-1 block">Tiers (Client ou Fournisseur)</label>
                    <input type="text" id="f_prov" placeholder="Ex: M. Cissé ou Garage X" class="w-full border-b-2 border-slate-200 p-2 text-sm outline-none focus:border-blue-500 transition-all">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase mb-1 block">Type de Flux</label>
                    <select id="f_type" class="w-full border-b-2 border-slate-200 p-2 text-sm font-bold text-blue-900 outline-none focus:border-blue-500 cursor-pointer">
                        <option value="ENTREE">RECETTE (+)</option>
                        <option value="SORTIE">DÉPENSE (-)</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase mb-1 block">Montant Net (FCFA)</label>
                    <input type="number" id="f_mt" placeholder="0" class="w-full border-b-2 border-slate-200 p-2 text-sm font-bold text-emerald-600 outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase mb-1 block">Mode</label>
                    <select id="f_mode" class="w-full border-b-2 border-slate-200 p-2 text-sm outline-none focus:border-blue-500">
                        <option>Espèce</option>
                        <option>Virement Bancaire</option>
                        <option>Mobile Money</option>
                        <option>Chèque</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase mb-1 block">Date de l'opération</label>
                    <input type="date" id="f_date" required class="w-full border-b-2 border-slate-200 p-2 text-sm outline-none focus:border-blue-500">
                </div>
                <button onclick="saveToSupabase()" class="col-span-2 bg-emerald-600 text-white p-4 font-bold uppercase text-xs mt-4 rounded-xl shadow-lg hover:bg-emerald-700 hover:-translate-y-1 transition-all">
                    Confirmer l'enregistrement
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION (À REMPLIR) ---
        const SUPABASE_URL = 'https://hovabdbreaqvtamfacaj.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_d1QmjaWGesiNT-V1WlddoQ_gk9C0r22';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let transactions = [];

        // --- 2. FONCTIONS DE SYNCHRONISATION ---
        async function fetchSupabase() {
            const { data, error } = await supabaseClient
                .from('transactions')
                .select('*')
                .order('date', { ascending: false }); // Plus récent en premier

            if (error) {
                console.error("Erreur de connexion:", error.message);
                alert("Problème de connexion Supabase. Vérifiez vos clés.");
            } else {
                transactions = data;
                render();
            }
        }

        async function saveToSupabase() {
            const lib = document.getElementById('f_lib').value;
            const mt = parseFloat(document.getElementById('f_mt').value);
            const dt = document.getElementById('f_date').value;

            if(!lib || isNaN(mt) || !dt) return alert("Champs obligatoires manquants !");

            const newTx = {
                date: dt,
                libelle: lib,
                provenance: document.getElementById('f_prov').value || "-",
                type: document.getElementById('f_type').value,
                mode: document.getElementById('f_mode').value,
                montant: mt
            };

            const { error } = await supabaseClient.from('transactions').insert([newTx]);

            if (error) {
                alert("Erreur SQL : " + error.message);
            } else {
                closeModal();
                fetchSupabase();
            }
        }

        async function deleteTx(id) {
            if(confirm("Confirmer la suppression de cette écriture comptable ?")) {
                const { error } = await supabaseClient.from('transactions').delete().eq('id', id);
                if (!error) fetchSupabase();
            }
        }

        // --- 3. RENDU ET FILTRES ---
        function render() {
            const m = document.getElementById('filterMonth').value;
            const y = document.getElementById('filterYear').value;
            const body = document.getElementById('excelBody');
            const emptyState = document.getElementById('emptyState');
            
            body.innerHTML = '';
            let totalGeneral = 0;

            const filtered = transactions.filter(t => {
                const d = new Date(t.date);
                return (m === 'ALL' || d.getMonth() == m) && d.getFullYear() == y;
            });

            if(filtered.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                filtered.forEach((t, i) => {
                    const isE = t.type === 'ENTREE';
                    totalGeneral += isE ? t.montant : -t.montant;
                    
                    body.innerHTML += `
                        <tr class="animate-in fade-in">
                            <td class="text-center opacity-30 text-[10px]">${i+1}</td>
                            <td class="font-medium">${t.date}</td>
                            <td class="font-bold uppercase text-slate-700">${t.libelle}</td>
                            <td class="uppercase text-slate-500 text-xs">${t.provenance}</td>
                            <td class="text-[10px] font-bold uppercase text-slate-400 italic">${t.mode}</td>
                            <td class="text-right font-mono font-bold ${isE?'text-emerald-600':'text-red-600'}">
                                ${isE?'+':'-'} ${t.montant.toLocaleString('fr-FR')}
                            </td>
                            <td class="text-center">
                                <button onclick="deleteTx(${t.id})" class="p-2 text-slate-300 hover:text-red-500 transition-colors">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </td>
                        </tr>`;
                });
            }
            
            const soldeEl = document.getElementById('statSolde');
            soldeEl.innerText = totalGeneral.toLocaleString('fr-FR') + " FCFA";
            soldeEl.className = `text-2xl font-mono font-bold ${totalGeneral >= 0 ? 'text-emerald-400' : 'text-red-400'}`;
        }

        // --- 4. EXPORT PDF PRO ---
        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const m = document.getElementById('filterMonth').value;
            const y = document.getElementById('filterYear').value;
            const mois = document.getElementById('filterMonth').options[document.getElementById('filterMonth').selectedIndex].text.toUpperCase();

            doc.setFont("helvetica", "bold");
            doc.setTextColor(0, 51, 102);
            doc.text("ENTREPRISE CISSÉ ET FRÈRES (ECF)", 105, 15, { align: "center" });
            doc.setFontSize(10);
            doc.text(`JOURNAL DE TRESORERIE - ${mois} ${y}`, 105, 22, { align: "center" });
            doc.setLineWidth(0.5);
            doc.line(20, 25, 190, 25);

            let total = 0;
            const data = transactions.filter(t => {
                const d = new Date(t.date);
                return (m === 'ALL' || d.getMonth() == m) && d.getFullYear() == y;
            }).map(t => {
                total += (t.type === 'ENTREE' ? t.montant : -t.montant);
                return [t.date, t.libelle.toUpperCase(), t.provenance.toUpperCase(), t.mode.toUpperCase(), (t.type=='ENTREE'?'+':'-')+" "+t.montant.toLocaleString()];
            });

            doc.autoTable({
                startY: 30,
                head: [['DATE', 'LIBELLÉ', 'TIERS', 'MODE', 'MONTANT (FCFA)']],
                body: data,
                theme: 'striped',
                headStyles: { fillColor: [0, 51, 102] },
                foot: [[ { content: 'SOLDE DE CLÔTURE', colSpan: 4, styles: { halign: 'right', fontStyle: 'bold' } }, 
                        { content: total.toLocaleString() + " FCFA", styles: { halign: 'right', fontStyle: 'bold' } } ]],
            });

            doc.save(`ECF_Journal_${mois}_${y}.pdf`);
        }

        // --- 5. UTILS ---
        function setupYears() {
            const s = document.

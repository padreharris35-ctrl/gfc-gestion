<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComptaGFC | Gbelebaban Football Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f1f5f9; }
        .excel-table { width: 100%; border-collapse: collapse; background: white; }
        .excel-table th { background: #003366; color: white; padding: 12px; font-size: 11px; text-transform: uppercase; text-align: left; position: sticky; top: 0; z-index: 10; }
        .excel-table td { border: 1px solid #e2e8f0; padding: 10px 14px; font-size: 13px; color: #334155; }
        .excel-table tr:hover { background-color: #f8fafc; }
        .status-badge { font-size: 10px; padding: 4px 10px; border-radius: 12px; font-weight: bold; display: flex; align-items: center; gap: 4px; }
        .sync-active { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="bg-[#003366] text-white p-4 flex justify-between items-center shadow-lg border-b-4 border-emerald-500">
        <div class="flex items-center gap-4">
            <div class="bg-white p-2 rounded-lg"><i class="fas fa-volleyball-ball text-[#003366] text-xl"></i></div>
            <div>
                <h1 class="text-xl font-bold italic">Compta<span class="text-emerald-400">GFC</span></h1>
                <p class="text-[10px] uppercase tracking-widest text-blue-200 font-bold">Gbelebaban Football Club</p>
            </div>
        </div>
        <div class="text-right">
            <div id="statSolde" class="text-2xl font-mono font-bold text-emerald-400">0 FCFA</div>
            <div class="text-[10px] text-blue-200 uppercase font-bold">Solde en Caisse</div>
        </div>
    </header>

    <nav class="bg-white border-b p-3 flex justify-between items-center px-6">
        <div class="flex gap-3">
            <button onclick="openModal()" class="bg-[#003366] text-white px-5 py-2.5 rounded text-xs font-bold uppercase hover:bg-slate-800 transition-all flex items-center">
                <i class="fas fa-plus-circle mr-2"></i> Nouveau Mouvement
            </button>
            <button onclick="exportPDF()" class="bg-red-600 text-white px-5 py-2.5 rounded text-xs font-bold uppercase hover:bg-red-700 transition-all flex items-center">
                <i class="fas fa-file-pdf mr-2"></i> Générer Journal
            </button>
            <div class="status-badge sync-active"><i class="fas fa-check-circle"></i> Supabase Connecté</div>
        </div>
        <div class="flex items-center gap-2 bg-slate-100 p-1.5 rounded border shadow-inner">
            <i class="fas fa-calendar-alt text-slate-400 px-2"></i>
            <select id="filterMonth" onchange="render()" class="bg-transparent p-1 text-xs font-bold outline-none border-r">
                <option value="ALL">Tous les mois</option>
                <option value="0">Janvier</option><option value="1">Février</option><option value="2">Mars</option>
                <option value="3">Avril</option><option value="4">Mai</option><option value="5">Juin</option>
                <option value="6">Juillet</option><option value="7">Août</option><option value="8">Septembre</option>
                <option value="9">Octobre</option><option value="10">Novembre</option><option value="11">Décembre</option>
            </select>
            <select id="filterYear" onchange="render()" class="bg-transparent p-1 text-xs font-bold outline-none"></select>
        </div>
    </nav>

    <main class="flex-1 overflow-auto p-6 bg-slate-100">
        <div class="bg-white shadow-xl rounded-xl overflow-hidden border border-slate-200">
            <table class="excel-table">
                <thead>
                    <tr>
                        <th class="w-12 text-center">N°</th>
                        <th class="w-28">Date</th>
                        <th>Désignation de l'opération</th>
                        <th>Tiers / Client</th>
                        <th class="w-32">Mode</th>
                        <th class="text-right w-44">Montant (FCFA)</th>
                        <th class="w-16 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="excelBody"></tbody>
            </table>
            <div id="emptyState" class="hidden p-20 text-center text-slate-400">
                <i class="fas fa-folder-open text-5xl mb-4 opacity-20"></i>
                <p>Aucune transaction enregistrée pour cette période.</p>
            </div>
        </div>
    </main>

    <div id="modalEntry" class="fixed inset-0 bg-slate-900/80 z-[100] hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white w-full max-w-lg shadow-2xl rounded-2xl overflow-hidden">
            <div class="bg-[#003366] text-white p-5 flex justify-between">
                <h3 class="font-bold uppercase text-sm">Saisie Comptable GFC</h3>
                <button onclick="closeModal()" class="text-white/50 hover:text-white text-xl">&times;</button>
            </div>
            <div class="p-8 grid grid-cols-2 gap-5">
                <div class="col-span-2">
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Désignation (Libellé)</label>
                    <input type="text" id="f_lib" class="w-full border-b-2 border-slate-200 p-2 text-sm outline-none focus:border-blue-500">
                </div>
                <div class="col-span-2">
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Tiers (Client / Destinataire)</label>
                    <input type="text" id="f_prov" class="w-full border-b-2 border-slate-200 p-2 text-sm outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Type de Flux</label>
                    <select id="f_type" class="w-full border-b-2 border-slate-200 p-2 text-sm font-bold text-blue-900 outline-none">
                        <option value="ENTREE">RECETTE (+)</option>
                        <option value="SORTIE">DÉPENSE (-)</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Montant Net (FCFA)</label>
                    <input type="number" id="f_mt" class="w-full border-b-2 border-slate-200 p-2 text-sm font-bold text-emerald-600 outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Mode de Paiement</label>
                    <select id="f_mode" class="w-full border-b-2 border-slate-200 p-2 text-sm outline-none">
                        <option>Espèce</option>
                        <option>Virement</option>
                        <option>Mobile Money</option>
                        <option>Chèque</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Date Effet</label>
                    <input type="date" id="f_date" required class="w-full border-b-2 border-slate-200 p-2 text-sm outline-none">
                </div>
                <button onclick="saveToSupabase()" class="col-span-2 bg-emerald-600 text-white p-4 font-bold uppercase text-xs mt-4 rounded-xl shadow-lg hover:bg-emerald-700 transition-all">
                    Enregistrer l'opération
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION (REMPLISSEZ VOS CLÉS ICI) ---
        const SUPABASE_URL = 'VOTRE_URL_ICI'; 
        const SUPABASE_KEY = 'VOTRE_CLE_ANON_ICI';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let transactions = [];

        // --- 2. FONCTIONS DE BASE ---
        function openModal() { document.getElementById('modalEntry').classList.remove('hidden'); }
        function closeModal() { document.getElementById('modalEntry').classList.add('hidden'); }

        function setupYears() {
    const s = document.getElementById('filterYear');
    if(!s) return;
    
    const curY = new Date().getFullYear();
    s.innerHTML = ''; // Nettoie le sélecteur
    
    // On boucle de 5 ans en arrière à 2 ans dans le futur
    for(let y = curY - 5; y <= curY + 2; y++){ 
        let o = document.createElement('option'); 
        o.value = y; 
        o.text = y; 
        if(y === curY) o.selected = true; 
        s.add(o); 
    }
    console.log("Années chargées avec succès");
}

        // --- 3. LOGIQUE SUPABASE ---
        async function fetchSupabase() {
            try {
                const { data, error } = await supabaseClient
                    .from('transactions')
                    .select('*')
                    .order('date', { ascending: false });

                if (error) throw error;
                transactions = data;
                render();
            } catch (e) {
                console.error("Erreur de récupération:", e.message);
            }
        }

        async function saveToSupabase() {
            const lib = document.getElementById('f_lib').value;
            const mt = parseFloat(document.getElementById('f_mt').value);
            const dt = document.getElementById('f_date').value;
            const type = document.getElementById('f_type').value;

            if(!lib || isNaN(mt) || !dt) return alert("Champs Libellé, Montant et Date obligatoires !");

            // VALIDATION AVANT ENREGISTREMENT
            const confirmation = confirm(`VALIDER L'ENREGISTREMENT ?\n\n${type} : ${lib}\nMontant : ${mt.toLocaleString('fr-FR')} FCFA`);
            if (!confirmation) return;

            const newTx = {
                date: dt, libelle: lib, provenance: document.getElementById('f_prov').value || "-",
                type: type, mode: document.getElementById('f_mode').value, montant: mt
            };

            const { error } = await supabaseClient.from('transactions').insert([newTx]);
            if (error) alert("Erreur SQL: " + error.message);
            else { closeModal(); fetchSupabase(); }
        }

        async function deleteTx(id) {
            // VALIDATION PAR CODE (2026)
            const codeAdmin = "2026"; 
            const saisie = prompt("SÉCURITÉ : Entrez le code administrateur pour supprimer :");

            if (saisie === codeAdmin) {
                const { error } = await supabaseClient.from('transactions').delete().eq('id', id);
                if (!error) fetchSupabase();
            } else if (saisie !== null) {
                alert("CODE INCORRECT !");
            }
        }

        // --- 4. AFFICHAGE ET PDF ---
        function render() {
            const m = document.getElementById('filterMonth').value;
            const y = document.getElementById('filterYear').value;
            const body = document.getElementById('excelBody');
            const emptyState = document.getElementById('emptyState');
            
            body.innerHTML = '';
            let total = 0;

            const filtered = transactions.filter(t => {
                const d = new Date(t.date);
                return (m === 'ALL' || d.getMonth() == m) && d.getFullYear() == y;
            });

            if(filtered.length === 0) emptyState.classList.remove('hidden');
            else {
                emptyState.classList.add('hidden');
                filtered.forEach((t, i) => {
                    const isE = t.type === 'ENTREE';
                    total += isE ? t.montant : -t.montant;
                    body.innerHTML += `
                        <tr>
                            <td class="text-center opacity-30 text-[10px]">${i+1}</td>
                            <td class="font-medium">${t.date}</td>
                            <td class="font-bold uppercase text-slate-700">${t.libelle}</td>
                            <td class="uppercase text-xs text-slate-500">${t.provenance}</td>
                            <td class="text-[10px] font-bold italic">${t.mode}</td>
                            <td class="text-right font-mono font-bold ${isE?'text-emerald-600':'text-red-600'}">
                                ${isE?'+':'-'} ${t.montant.toLocaleString('fr-FR')}
                            </td>
                            <td class="text-center">
                                <button onclick="deleteTx(${t.id})" class="text-slate-200 hover:text-red-500 transition-colors"><i class="fas fa-trash-alt"></i></button>
                            </td>
                        </tr>`;
                });
            }
            const stat = document.getElementById('statSolde');
            stat.innerText = total.toLocaleString('fr-FR') + " FCFA";
            stat.className = `text-2xl font-mono font-bold ${total >= 0 ? 'text-emerald-400' : 'text-red-400'}`;
        }

        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            const m = document.getElementById('filterMonth').value;
            const y = document.getElementById('filterYear').value;
            const mois = document.getElementById('filterMonth').options[document.getElementById('filterMonth').selectedIndex].text.toUpperCase();
            const periodeTitre = m === 'ALL' ? `ANNÉE ${y}` : `${mois} ${y}`;

            doc.setFont("helvetica", "bold");
            doc.setFontSize(18);
            doc.setTextColor(0, 51, 102);
            doc.text("COMPTABILITE GBELEBAN FOOTBALL CLUB", 105, 15, { align: "center" });
            
            doc.setFontSize(11);
            doc.setTextColor(80, 80, 80);
            doc.text(`JOURNAL DE TRESORERIE : ${periodeTitre}`, 105, 22, { align: "center" });
            doc.line(20, 25, 190, 25);

            let soldeTotal = 0;
            const dataTable = transactions.filter(t => {
                const d = new Date(t.date);
                return (m === 'ALL' || d.getMonth() == m) && d.getFullYear() == y;
            }).sort((a,b) => new Date(a.date) - new Date(b.date))
            .map(t => {
                const isE = t.type === 'ENTREE';
                soldeTotal += isE ? t.montant : -t.montant;
                return [t.date, t.libelle.toUpperCase(), t.provenance.toUpperCase(), t.mode.toUpperCase(), (isE?'+':'-')+" "+t.montant.toLocaleString('fr-FR')];
            });

            doc.autoTable({
                startY: 30,
                head: [['DATE', 'DESIGNATION', 'TIERS / CLIENT', 'MODE', 'MONTANT (FCFA)']],
                body: dataTable,
                theme: 'striped',
                headStyles: { fillColor: [0, 51, 102], fontSize: 9, halign: 'center' },
                columnStyles: { 4: { halign: 'right', fontStyle: 'bold', cellWidth: 35 } },
                foot: [[ { content: 'SOLDE FINAL DE LA PERIODE', colSpan: 4, styles: { halign: 'right', fontStyle: 'bold' } }, 
                        { content: soldeTotal.toLocaleString('fr-FR') + " FCFA", styles: { halign: 'right', fontStyle: 'bold', fillColor: [230, 255, 230] } } ]],
                styles: { fontSize: 8, overflow: 'linebreak' }
            });
            doc.save(`GFC_Journal_${periodeTitre.replace(' ','_')}.pdf`);
        }

        // --- 5. INITIALISATION ---
        window.onload = () => {
            setupYears();
            document.getElementById('f_date').valueAsDate = new Date();
            fetchSupabase();
        };
    </script>
</body>
</html>

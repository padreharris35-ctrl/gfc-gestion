<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComptaGFC | Gbelebaban Football Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f1f5f9; }
        .excel-table { width: 100%; border-collapse: collapse; background: white; }
        .excel-table th { background: #003366; color: white; padding: 12px; font-size: 11px; text-transform: uppercase; text-align: left; }
        .excel-table td { border: 1px solid #e2e8f0; padding: 10px; font-size: 13px; color: #334155; }
        .excel-table tr:hover { background-color: #f8fafc; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="bg-[#003366] text-white p-4 shadow-lg border-b-4 border-emerald-500">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="bg-white p-2 rounded-lg"><i class="fas fa-volleyball-ball text-[#003366] text-xl"></i></div>
                <div>
                    <h1 class="text-xl font-bold italic">Compta<span class="text-emerald-400">GFC</span></h1>
                    <p class="text-[10px] uppercase tracking-widest text-blue-200 font-bold">Gbelebaban Football Club</p>
                </div>
            </div>

            <div class="flex flex-wrap justify-center gap-6 bg-slate-900/40 p-3 rounded-xl border border-white/10">
                <div class="text-center px-4 border-r border-white/10">
                    <div id="statEntrees" class="text-lg font-mono font-bold text-emerald-400">0 FCFA</div>
                    <div class="text-[9px] uppercase text-emerald-200 opacity-70 font-bold">Total Entrées</div>
                </div>
                <div class="text-center px-4 border-r border-white/10">
                    <div id="statSorties" class="text-lg font-mono font-bold text-red-400">0 FCFA</div>
                    <div class="text-[9px] uppercase text-red-200 opacity-70 font-bold">Total Dépenses</div>
                </div>
                <div class="text-center px-4">
                    <div id="statSolde" class="text-xl font-mono font-bold text-white">0 FCFA</div>
                    <div class="text-[9px] uppercase text-blue-200 opacity-70 font-bold">Solde Global</div>
                </div>
            </div>
        </div>
    </header>

    <nav class="bg-white border-b p-3 flex flex-wrap justify-between items-center px-6 gap-4">
        <div class="flex gap-3">
            <button onclick="openModal()" class="bg-[#003366] text-white px-5 py-2.5 rounded text-xs font-bold uppercase hover:bg-slate-800 transition-all flex items-center">
                <i class="fas fa-plus-circle mr-2"></i> Nouveau Mouvement
            </button>
            <button onclick="exportPDF()" class="bg-red-600 text-white px-5 py-2.5 rounded text-xs font-bold uppercase hover:bg-red-700 transition-all flex items-center shadow-lg">
                <i class="fas fa-file-pdf mr-2"></i> Générer Journal
            </button>
        </div>

        <div class="flex items-center gap-2 bg-slate-50 p-2 rounded-lg border border-slate-200">
            <span class="text-[9px] font-bold text-slate-500 uppercase px-1">Période Journal :</span>
            <input type="date" id="pdf_start" class="bg-white border p-1 text-xs rounded outline-none border-blue-200">
            <span class="text-[9px] font-bold">AU</span>
            <input type="date" id="pdf_end" class="bg-white border p-1 text-xs rounded outline-none border-blue-200">
        </div>

        <div class="flex items-center gap-2 bg-slate-100 p-1.5 rounded border">
            <select id="filterMonth" onchange="render()" class="bg-transparent p-1 text-xs font-bold outline-none border-r">
                <option value="ALL">Tous les mois</option>
                <option value="0">Janvier</option><option value="1">Février</option><option value="2">Mars</option>
                <option value="3">Avril</option><option value="4">Mai</option><option value="5">Juin</option>
                <option value="6">Juillet</option><option value="7">Août</option><option value="8">Septembre</option>
                <option value="9">Octobre</option><option value="10">Novembre</option><option value="11">Décembre</option>
            </select>
            <select id="filterYear" onchange="render()" class="bg-transparent p-1 text-xs font-bold outline-none"></select>
        </div>
    </nav>

    <main class="flex-1 overflow-auto p-6 bg-slate-100">
        <div class="bg-white shadow-xl rounded-xl overflow-hidden border border-slate-200">
            <table class="excel-table">
                <thead>
                    <tr>
                        <th class="w-12 text-center">N°</th>
                        <th class="w-28">Date</th>
                        <th>Désignation</th>
                        <th>Tiers / Client</th>
                        <th>Mode</th>
                        <th class="text-right">Montant (FCFA)</th>
                        <th class="w-16 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="excelBody"></tbody>
            </table>
        </div>
    </main>

    <div id="modalEntry" class="fixed inset-0 bg-slate-900/80 z-[100] hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white w-full max-w-lg shadow-2xl rounded-2xl overflow-hidden">
            <div class="bg-[#003366] text-white p-5 flex justify-between">
                <h3 class="font-bold uppercase text-sm">Saisie Comptable GFC</h3>
                <button onclick="closeModal()" class="text-white/50 hover:text-white text-xl">&times;</button>
            </div>
            <div class="p-8 grid grid-cols-2 gap-5">
                <div class="col-span-2">
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Désignation</label>
                    <input type="text" id="f_lib" class="w-full border-b-2 border-slate-200 p-2 text-sm outline-none">
                </div>
                <div class="col-span-2">
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Tiers (Client / Destinataire)</label>
                    <input type="text" id="f_prov" class="w-full border-b-2 border-slate-200 p-2 text-sm outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Type</label>
                    <select id="f_type" class="w-full border-b-2 border-slate-200 p-2 text-sm font-bold">
                        <option value="ENTREE">RECETTE (+)</option>
                        <option value="SORTIE">DÉPENSE (-)</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Montant (FCFA)</label>
                    <input type="number" id="f_mt" class="w-full border-b-2 border-slate-200 p-2 text-sm font-bold text-emerald-600">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Mode</label>
                    <select id="f_mode" class="w-full border-b-2 border-slate-200 p-2 text-sm">
                        <option>Espèce</option>
                        <option>Virement</option>
                        <option>Mobile Money</option>
                        <option>Chèque</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Date</label>
                    <input type="date" id="f_date" class="w-full border-b-2 border-slate-200 p-2 text-sm">
                </div>
                <button onclick="saveToSupabase()" class="col-span-2 bg-emerald-600 text-white p-4 font-bold uppercase text-xs mt-4 rounded-xl shadow-lg hover:bg-emerald-700">
                    Enregistrer l'opération
                </button>
            </div>
        </div>
    </div>

    <script>
        // 1. CONFIGURATION (METTEZ VOS CLÉS ICI)
        const SUPABASE_URL = 'https://hovabdbreaqvtamfacaj.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_d1QmjaWGesiNT-V1WlddoQ_gk9C0r22';

        let supabaseClient;
        let transactions = [];

        // 2. FONCTIONS DE BASE
        window.openModal = function() { document.getElementById('modalEntry').classList.remove('hidden'); }
        window.closeModal = function() { document.getElementById('modalEntry').classList.add('hidden'); }

        window.setupYears = function() {
            const s = document.getElementById('filterYear');
            if(!s) return;
            const curY = new Date().getFullYear();
            s.innerHTML = ''; 
            for(let y = curY - 5; y <= curY + 25; y++){ 
                let o = document.createElement('option'); 
                o.value = y; o.text = y; 
                if(y === curY) o.selected = true; 
                s.add(o); 
            }
        }

        const formatArgent = (num) => {
            return new Intl.NumberFormat('fr-FR').format(num).replace(/\u00a0/g, ' ').replace(/\s/g, ' ');
        };

        async function fetchSupabase() {
            try {
                const { data, error } = await supabaseClient.from('transactions').select('*').order('date', { ascending: false });
                if (error) throw error;
                transactions = data; 
                render();
            } catch (e) {
                console.error("Erreur Fetch:", e.message);
            }
        }

        window.saveToSupabase = async function() {
            const lib = document.getElementById('f_lib').value;
            const mt = parseFloat(document.getElementById('f_mt').value);
            const dt = document.getElementById('f_date').value;
            if(!lib || isNaN(mt) || !dt) return alert("Remplissez Libellé, Montant et Date !");
            
            const newTx = {
                date: dt, libelle: lib, provenance: document.getElementById('f_prov').value || "-",
                type: document.getElementById('f_type').value, mode: document.getElementById('f_mode').value, montant: mt
            };

            const { error } = await supabaseClient.from('transactions').insert([newTx]);
            if (error) alert("Erreur SQL: " + error.message);
            else { closeModal(); fetchSupabase(); }
        }

        window.deleteTx = async function(id) {
            if (prompt("CODE SÉCURITÉ :") === "2026") {
                await supabaseClient.from('transactions').delete().eq('id', id);
                fetchSupabase();
            }
        }

        window.render = function() {
            const m = document.getElementById('filterMonth').value;
            const y = document.getElementById('filterYear').value;
            const body = document.getElementById('excelBody');
            body.innerHTML = '';
            let ent = 0, sor = 0;

            transactions.filter(t => {
                const d = new Date(t.date);
                return (m === 'ALL' || d.getMonth() == m) && d.getFullYear() == y;
            }).forEach((t, i) => {
                const isE = t.type === 'ENTREE';
                if(isE) ent += t.montant; else sor += t.montant;
                body.innerHTML += `<tr>
                    <td class="text-center opacity-50">${i+1}</td>
                    <td>${t.date}</td>
                    <td class="font-bold uppercase">${t.libelle}</td>
                    <td class="text-xs uppercase text-slate-500">${t.provenance}</td>
                    <td class="text-[10px] italic font-bold">${t.mode}</td>
                    <td class="text-right font-bold ${isE?'text-emerald-600':'text-red-600'}">
                        ${isE?'+':'-'} ${formatArgent(t.montant)} FCFA
                    </td>
                    <td class="text-center">
                        <button onclick="deleteTx(${t.id})" class="text-slate-200 hover:text-red-500"><i class="fas fa-trash-alt"></i></button>
                    </td>
                </tr>`;
            });

            document.getElementById('statEntrees').innerText = formatArgent(ent) + " FCFA";
            document.getElementById('statSorties').innerText = formatArgent(sor) + " FCFA";
            const solde = ent - sor;
            const sEl = document.getElementById('statSolde');
            sEl.innerText = formatArgent(solde) + " FCFA";
            sEl.className = `text-xl font-mono font-bold ${solde >= 0 ? 'text-white' : 'text-red-400'}`;
        }

        window.exportPDF = function() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            const dS = document.getElementById('pdf_start').value;
            const dE = document.getElementById('pdf_end').value;
            if(!dS || !dE) return alert("Sélectionnez les dates.");

            doc.setFont("helvetica", "bold");
            doc.setFontSize(16); doc.setTextColor(0, 51, 102);
            doc.text("COMPTABILITE GBELEBAN FOOTBALL CLUB", 105, 15, { align: "center" });
            doc.setFontSize(11); doc.setTextColor(100, 100, 100);
            doc.text(`JOURNAL DE TRESORERIE DU ${new Date(dS).toLocaleDateString()} AU ${new Date(dE).toLocaleDateString()}`, 105, 22, { align: "center" });
            doc.line(20, 25, 190, 25);

            let net = 0;
            const data = transactions.filter(t => t.date >= dS && t.date <= dE).sort((a,b) => new Date(a.date) - new Date(b.date))
            .map(t => {
                const isE = t.type === 'ENTREE'; net += isE ? t.montant : -t.montant;
                return [t.date, t.libelle.toUpperCase(), t.provenance.toUpperCase(), t.mode.toUpperCase(), (isE?'+ ':'- ')+formatArgent(t.montant)];
            });

            doc.autoTable({
                startY: 32,
                head: [['DATE', 'DESIGNATION', 'TIERS', 'MODE', 'MONTANT (FCFA)']],
                body: data,
                theme: 'striped',
                headStyles: { fillColor: [0, 51, 102], halign: 'center' },
                columnStyles: { 4: { halign: 'right', fontStyle: 'bold', cellWidth: 45 } },
                foot: [[
                    { content: 'SOLDE NET DE LA PÉRIODE', colSpan: 4, styles: { halign: 'right', fontStyle: 'bold', fontSize: 12, textColor: [200, 0, 0] } },
                    { content: formatArgent(net) + " FCFA", styles: { halign: 'right', fontStyle: 'bold', fontSize: 12, textColor: [200, 0, 0] } }
                ]],
                styles: { fontSize: 8.5 }
            });
            doc.save(`Journal_GFC_Export.pdf`);
        }

        // 3. INITIALISATION AVEC DIAGNOSTIC
        window.onload = async () => {
            setupYears();
            const today = new Date();
            document.getElementById('pdf_start').valueAsDate = new Date(today.getFullYear(), today.getMonth(), 1);
            document.getElementById('pdf_end').valueAsDate = today;
            document.getElementById('f_date').valueAsDate = today;

            try {
                if(SUPABASE_URL === 'VOTRE_URL_ICI') {
                    console.log("Attention: Clés non configurées");
                    return;
                }
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                
                // Test de connexion direct
                const { data, error } = await supabaseClient.from('transactions').select('*').limit(1);
                if(error) throw error;
                
                console.log("Connexion Supabase OK !");
                fetchSupabase();
            } catch (err) {
                alert("ERREUR CONNEXION : " + err.message + "\n\nVérifiez RLS et Clés API.");
            }
        };
    </script>
</body>
</html>

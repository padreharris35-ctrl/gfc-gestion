<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0b1f45">
  <title>Gbéléban Football Club</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="application demarrage">
  <a class="lien-evitement" href="#contenu">Aller au contenu</a>

  <aside class="barre-laterale" id="barre-laterale" aria-label="Menu du club">
    <a class="marque" href="#/tableau-de-bord">
      <img src="assets/logo.png" alt="" width="48" height="48">
      <span class="marque-texte"><span class="marque-nom">Gbéléban</span><span class="marque-sous">Football Club</span></span>
    </a>
    <nav aria-label="Navigation principale">
      <ul id="menu" class="menu"></ul>
    </nav>
    <div class="compte">
      <span class="compte-nom" id="compte-nom"></span>
      <span class="compte-role" id="compte-role"></span>
      <button type="button" class="bouton-lien" id="btn-deconnexion">Se déconnecter</button>
    </div>
  </aside>
  <div class="voile" id="voile" aria-hidden="true"></div>

  <div class="principal">
    <header class="barre-mobile">
      <button type="button" class="bouton-menu" id="btn-menu" aria-controls="barre-laterale" aria-expanded="false">
        <span class="bouton-menu-icone" aria-hidden="true"></span>
        <span>Menu</span>
      </button>
      <a class="barre-mobile-marque" href="#/tableau-de-bord">
        <img src="assets/logo.png" alt="" width="32" height="32">
        <span>Gbéléban FC</span>
      </a>
    </header>
    <main id="contenu" class="contenu" tabindex="-1">
      <div class="chargement" role="status"><span class="roue" aria-hidden="true"></span><span>Chargement…</span></div>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
